name: Rendu complet T3 — voix + musique D

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publier le rendu complet dans une pré-Release immuable
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: t3-complete-voice-music-D-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout T3
        uses: actions/checkout@v5

      - name: Préparer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer FFmpeg et les dépendances verrouillées
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Compiler et tester tous les contrats
        run: |
          set -euo pipefail
          python -m compileall -q engine tools audio/scripts tests
          python -m unittest discover -s tests -v
          (cd audio/music/t3-afrobeat-v1 && sha256sum --check SHA256SUMS.txt)
          (cd audio/voice/t3-voice-v1 && sha256sum --check SHA256SUMS.txt)

      - name: Télécharger le silencieux v0.4 approuvé et verrouiller ses hashes
        run: |
          set -euo pipefail
          mkdir -p .tmp/t3-approved-visual
          python - <<'PY' > /tmp/t3-visual.env
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/T3_VOICE_MIX_V1_0_0.json').read_text())['visual_approved']
          print('URL=' + cfg['download_url'])
          print('FILE=' + cfg['filename'])
          print('SHA256=' + cfg['file_sha256'])
          print('STREAM_SHA256=' + cfg['video_bitstream_sha256'])
          PY
          source /tmp/t3-visual.env
          curl --fail --location --retry 5 --retry-all-errors \
            "$URL" --output ".tmp/t3-approved-visual/$FILE"
          echo "$SHA256  .tmp/t3-approved-visual/$FILE" | sha256sum --check --strict
          ACTUAL_STREAM_HASH="$(ffmpeg -v error -i ".tmp/t3-approved-visual/$FILE" -map 0:v:0 -c copy -f hash -hash sha256 - | cut -d= -f2 | tr 'A-F' 'a-f')"
          test "$ACTUAL_STREAM_HASH" = "$STREAM_SHA256"
          echo "Approved visual file: $SHA256"
          echo "Approved visual stream: $ACTUAL_STREAM_HASH"

      - name: Produire un seul rendu complet avec Dlozi Lam
        run: |
          set -euo pipefail
          source /tmp/t3-visual.env
          python audio/scripts/build_t3_complete_voice.py \
            --silent-video ".tmp/t3-approved-visual/$FILE" \
            --music-config config/T3_MUSIC_PACK_V1_0_0.json \
            --mix-config config/T3_VOICE_MIX_V1_0_0.json \
            --output-dir output/t3-complete-v0.7.0

      - name: Valider indépendamment vidéo, voix, musique et audio
        run: |
          set -euo pipefail
          python tools/validate_complete.py \
            --output-dir output/t3-complete-v0.7.0 \
            --music-config config/T3_MUSIC_PACK_V1_0_0.json \
            --mix-config config/T3_VOICE_MIX_V1_0_0.json \
            --proof output/t3-complete-v0.7.0/T3_COMPLETE_INDEPENDENT_VALIDATION.json

      - name: Écrire le résumé du run
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('output/t3-complete-v0.7.0/T3_COMPLETE_INDEPENDENT_VALIDATION.json')
          v = json.loads(p.read_text())
          a = v['audio']['final_loudness']
          print('# RESTAURATION‑T3 — rendu complet')
          print()
          print(f"**{v['status']} — {v['summary']['passed']}/{v['summary']['total']} contrôles indépendants PASS**")
          print()
          print(f"- vidéo : `{v['video']['file']}`")
          print(f"- SHA-256 : `{v['video']['sha256']}`")
          print('- musique : **D — Dlozi Lam / PremiumMusicOdyssey**')
          print('- voix : **voice-02**, placements 1,2 / 6,8 / 14,7 / 21,8 s')
          print(f"- audio : {float(a['input_i']):.2f} LUFS, {float(a['input_tp']):.2f} dBTP, AAC stéréo 48 kHz")
          print(f"- flux vidéo immuable : `{v['visual']['actual_bitstream_sha256']}`")
          PY

      - name: Assembler la livraison sans source Pixabay intégrale
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          cp output/t3-complete-v0.7.0/VIDEO_T3_COMPLETE_VOIX_MUSIQUE_D_V0_7_A_VALIDER.mp4 release/
          cp output/t3-complete-v0.7.0/T3_MASTER_AUDIO_VOIX_MUSIQUE_D_30S.wav release/
          cp output/t3-complete-v0.7.0/T3_COMPLETE_RENDER_REPORT.json release/
          cp output/t3-complete-v0.7.0/T3_COMPLETE_INDEPENDENT_VALIDATION.json release/
          cp output/t3-complete-v0.7.0/RAPPORT_RENDU_COMPLET.md release/
          cp config/T3_MUSIC_PACK_V1_0_0.json release/
          cp config/T3_VOICE_MIX_V1_0_0.json release/
          cp audio/music/t3-afrobeat-v1/source_manifest.json release/T3_MUSIC_SOURCE_MANIFEST.json
          cp audio/music/t3-afrobeat-v1/BUILD_PROVENANCE.json release/T3_MUSIC_BUILD_PROVENANCE.json
          cp audio/voice/t3-voice-v1/manifest.json release/T3_VOICE_MANIFEST.json
          test "$(find release -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 1
          if find release -maxdepth 1 -type f -name '*.mp3' | grep -q .; then
            echo 'Les dérivés musicaux restent versionnés dans le dépôt; aucun MP3 autonome dans la Release.' >&2
            exit 1
          fi
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publier l’artefact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: T3-complete-voice-music-D-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Préparer les notes de pré-Release
        if: inputs.publish_prerelease
        run: |
          cat > /tmp/t3-complete-release-notes.md <<'EOF'
          # RESTAURATION‑T3 — rendu complet voix + musique D

          Rendu produit exclusivement sur GitHub Actions à partir du commit indiqué par cette pré-Release.

          - un seul MP4 complet;
          - base visuelle : silencieux v0.4 approuvé, flux H.264 copié bit pour bit sans réencodage;
          - 30,000 s · 720 × 1280 · 30 i/s · 900 images;
          - musique choisie : **D — Dlozi Lam / PremiumMusicOdyssey**;
          - voix française masculine `voice-02` aux quatre placements approuvés;
          - ducking repris de T1 : −3 dB hors parole, −10 dB sous parole, attaque 120 ms, relâchement 450 ms;
          - master cible −16 LUFS / −2 dBTP;
          - AAC stéréo 48 kHz;
          - aucun écrêtage;
          - rapports de rendu et validation indépendante inclus;
          - aucun fichier source Pixabay intégral ou MP3 musical autonome dans la Release.

          Les quatre dérivés musicaux approuvés A–D, leurs preuves, la voix et les configurations reproductibles sont versionnés dans le dépôt. Le rendu de cette Release utilise uniquement D.
          EOF

      - name: Publier une pré-Release additive et immuable
        if: inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="t3-coulisses-v0.7.0-complete-D-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG existe déjà : refus de l’écraser." >&2
            exit 1
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "T3 Coulisses — rendu complet voix + musique D #${GITHUB_RUN_NUMBER}" \
            --notes-file /tmp/t3-complete-release-notes.md \
            --prerelease
