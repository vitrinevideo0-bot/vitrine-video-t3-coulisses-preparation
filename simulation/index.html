<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RESTAURATION‑T3 — simulation des 12 écrans</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090806;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#382114,#090806 55%)}main{width:min(94vw,430px);padding:22px}.phone{border:1px solid #71533d;border-radius:32px;background:#14100d;overflow:hidden;box-shadow:0 24px 80px #000b}.preview{aspect-ratio:9/11;background:linear-gradient(145deg,#4c2d18,#140f0b);display:grid;place-items:center;padding:24px;text-align:center}.badge{color:#ffb703;font-weight:900;letter-spacing:.12em}.state{font-size:13px;color:#e0cfc1}.title{font-size:30px;line-height:1;margin:12px 0}.description{color:#f0e5dc;line-height:1.45}.actions{padding:18px;display:flex;gap:10px}.actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900;cursor:pointer}.primary{background:#f46b27;color:#fff}.secondary{background:#33261f;color:#fff}.meta{padding:0 18px 18px;color:#bda99b;font-size:12px}.error{color:#ff8f8f}</style>
</head>
<body><main><h1>Parcours T3</h1><p>Simulation exécutable du contrat approuvé : quatre scènes × A/B/C.</p><div class="phone"><section class="preview" id="screen"><p>Chargement…</p></section><div class="actions"><button class="secondary" id="previous">PRÉCÉDENT</button><button class="primary" id="next">SUIVANT</button></div><div class="meta" id="meta"></div></div></main><script src="app.js"></script></body>
</html>
